[project]
name = "knowbase"
version = "0.1.0"
description = "Versioned, provenance-grounded knowledge layer over a codebase"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Dmitry Voropaev" }]
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "grimp>=3,<4",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13",
    "pygit2>=1.14",
    "typer>=0.12",
    "pydantic>=2.6,<3",
    "tree-sitter-python>=0.25.0",
    "sqlparse>=0.5.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
kb = "kb.daemon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.pytest.ini_options]
testpaths = ["src/kb/eval"]
python_files = ["*_test.py", "test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["kb"]
mypy_path = "src"
strict = true

# The eval package is tests + their harness; it is validated by running, not by strict typing.
[[tool.mypy.overrides]]
module = ["kb.eval.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pygit2.*", "grimp.*", "sqlparse.*"]
ignore_missing_imports = true
