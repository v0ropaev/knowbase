<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="knowbase logo">
  <title>knowbase</title>
  <!-- Brand palette: cream #FAF3E7, deep green #1C4434, gold #CA9C50, gray-green #798D81 -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="#FAF3E7"/>
  <!-- arch -->
  <path d="M32 96 L32 46 A28 28 0 0 1 88 46 L88 96" fill="none" stroke="#1C4434" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hub spokes -->
  <g stroke="#798D81" stroke-width="3.2" stroke-linecap="round">
    <line x1="60" y1="42" x2="60" y2="32"/>
    <line x1="68.66" y1="47" x2="77.32" y2="42"/>
    <line x1="68.66" y1="57" x2="77.32" y2="62"/>
    <line x1="60" y1="62" x2="60" y2="72"/>
    <line x1="51.34" y1="57" x2="42.68" y2="62"/>
    <line x1="51.34" y1="47" x2="42.68" y2="42"/>
  </g>
  <!-- hub nodes -->
  <g fill="#798D81">
    <circle cx="60" cy="32" r="3.5"/>
    <circle cx="77.32" cy="42" r="3.5"/>
    <circle cx="77.32" cy="62" r="3.5"/>
    <circle cx="60" cy="72" r="3.5"/>
    <circle cx="42.68" cy="62" r="3.5"/>
    <circle cx="42.68" cy="42" r="3.5"/>
  </g>
  <!-- gold center ring (hollow) -->
  <circle cx="60" cy="52" r="8" fill="#FAF3E7" stroke="#CA9C50" stroke-width="5"/>
  <!-- base bars -->
  <rect x="38" y="103" width="44" height="4.5" rx="2.2" fill="#CA9C50"/>
  <rect x="32" y="111" width="56" height="4.5" rx="2.2" fill="#1C4434"/>
</svg>
